<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>DraftDock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #1e1e1e;
      color: #d4d4d4;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 8px;
    }

    .textarea-container {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #draft-textarea {
      width: 100%;
      height: 100%;
      resize: none;
      border: 1px solid #3c3c3c;
      border-radius: 4px;
      padding: 12px;
      font-family: Consolas, 'Courier New', Menlo, Monaco, monospace;
      font-size: 14px;
      line-height: 1.5;
      background-color: #252526;
      color: #d4d4d4;
      outline: none;
    }

    #draft-textarea:focus {
      border-color: #007acc;
    }

    #draft-textarea::placeholder {
      color: #6b6b6b;
    }

    .button-container {
      display: flex;
      justify-content: flex-end;
      padding-top: 8px;
      gap: 8px;
    }

    button {
      padding: 6px 16px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #clear-btn {
      background-color: #3c3c3c;
      color: #d4d4d4;
    }

    #clear-btn:hover {
      background-color: #4c4c4c;
    }

    #clear-btn:active {
      background-color: #5c5c5c;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="textarea-container">
      <textarea
        id="draft-textarea"
        placeholder="下書きを入力..."
        spellcheck="false"
      ></textarea>
    </div>
    <div class="button-container">
      <button id="clear-btn" type="button">クリア</button>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
