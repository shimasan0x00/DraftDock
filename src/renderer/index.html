<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'">
  <title>DraftDock</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <div class="textarea-container">
      <textarea
        id="draft-textarea"
        placeholder="下書きを入力..."
        spellcheck="false"
        aria-label="下書きテキスト"
      ></textarea>
    </div>
    <div id="status-message" class="status-message" role="status" hidden></div>
    <div class="button-container">
      <button id="clear-btn" type="button">クリア</button>
      <button id="copy-btn" type="button">コピー</button>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
