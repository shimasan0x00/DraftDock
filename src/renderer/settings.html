<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>DraftDock - 設定</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <h1>設定</h1>

    <div class="form-group">
      <label for="toggle-hotkey">起動キー</label>
      <input
        type="text"
        id="toggle-hotkey"
        class="hotkey-input"
        placeholder="キーを押して設定..."
        readonly
      >
      <div class="hint">ウィンドウの表示/非表示を切り替えます</div>
    </div>

    <div class="form-group">
      <label for="copy-hotkey">コピーキー</label>
      <input
        type="text"
        id="copy-hotkey"
        class="hotkey-input"
        placeholder="キーを押して設定..."
        readonly
      >
      <div class="hint">テキストをコピーしてウィンドウを閉じます</div>
    </div>

    <div class="form-group">
      <label for="clear-hotkey">クリアキー</label>
      <input
        type="text"
        id="clear-hotkey"
        class="hotkey-input"
        placeholder="キーを押して設定..."
        readonly
      >
      <div class="hint">テキストエリアをクリアします</div>
    </div>

    <div class="button-container">
      <button id="cancel-btn" type="button">キャンセル</button>
      <button id="save-btn" type="button">保存</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
